name: claude-review

# Shared opt-in Claude code review for Cube-27 repos, billed to the caller repo's ANTHROPIC_API_KEY secret.
# Each repo adds a small caller workflow (see README.md) with the issue_comment and workflow_dispatch triggers;
# github.event here is the caller's event. Start a review with either:
#   gh pr comment <n> --body "/claude-review"
#   gh workflow run claude-review.yml -f pr=<n>
# Only comments by users with write access start it, so others can't spend the key on public repos.

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/claude-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.issue.number || github.event.inputs.pr }}
      cancel-in-progress: false
    env:
      PR: ${{ github.event.issue.number || github.event.inputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ env.PR }}/head
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ env.PR }}"
